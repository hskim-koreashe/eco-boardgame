<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>풀숲 기억교실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head><body>
<div class="top"><h1>🌱 풀숲 기억교실</h1></div>
<div class="wrap">
<p class="note">환경아카이브 풀숲의 사진 8장을 45초 동안 함께 들여다본 뒤, 기억으로 정답을 맞히고 마지막엔 시간 순서로 줄까지 세우는 게임. 혼자서도, 열 명까지도. 3~4분.</p>

<div class="card">
<h2>방 만들기</h2>
<label for="n1">닉네임</label>
<input id="n1" type="text" maxlength="10" placeholder="예: 기억왕김">
<button class="btn big" id="create">방 만들기</button>
</div>

<div class="divider">또는</div>

<div class="card">
<h2>방 참가하기</h2>
<label for="n2">닉네임</label>
<input id="n2" type="text" maxlength="10" placeholder="예: 기억왕박">
<label for="code">방 코드 (5자리)</label>
<input id="code" type="text" maxlength="5" placeholder="ABCDE" style="text-transform:uppercase;letter-spacing:.15em;font-weight:900">
<button class="btn big ghost" id="join">참가하기</button>
</div>

<p class="err" id="err" hidden></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-init.js"></script>
<script>
const err = document.getElementById("err");
function showErr(m){ err.textContent = m; err.hidden = false; }

document.getElementById("create").onclick = async () => {
  const name = document.getElementById("n1").value.trim();
  if (!name) return showErr("닉네임을 입력해 주세요.");
  err.hidden = true;
  try {
    const user = await ensureSignedIn();
    const code = makeRoomCode();
    await db.collection("rooms").doc(code).set({
      code, status: "lobby", hostUid: user.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      baseOrder: [user.uid],
      players: { [user.uid]: { name, answers: {} } }
    });
    sessionStorage.setItem("nickname", name);
    location.href = `room.html?code=${code}`;
  } catch (e) { showErr("방을 만들지 못했습니다: " + e.message); }
};

document.getElementById("join").onclick = async () => {
  const name = document.getElementById("n2").value.trim();
  const code = document.getElementById("code").value.trim().toUpperCase();
  if (!name) return showErr("닉네임을 입력해 주세요.");
  if (code.length !== 5) return showErr("방 코드 5자리를 확인해 주세요.");
  err.hidden = true;
  try {
    const user = await ensureSignedIn();
    const ref = db.collection("rooms").doc(code);
    await db.runTransaction(async tx => {
      const snap = await tx.get(ref);
      if (!snap.exists) throw new Error("존재하지 않는 방 코드입니다.");
      const room = snap.data();
      if (room.status !== "lobby") throw new Error("이미 시작된 방입니다.");
      if (room.players[user.uid]) return; // 이미 참가함(새로고침 등)
      const n = Object.keys(room.players).length;
      if (n >= 10) throw new Error("정원(10명)이 찼습니다.");
      tx.update(ref, {
        [`players.${user.uid}`]: { name, answers: {} },
        baseOrder: firebase.firestore.FieldValue.arrayUnion(user.uid)
      });
    });
    sessionStorage.setItem("nickname", name);
    location.href = `room.html?code=${code}`;
  } catch (e) { showErr(e.message || "참가하지 못했습니다."); }
};
</script>
</body></html>
